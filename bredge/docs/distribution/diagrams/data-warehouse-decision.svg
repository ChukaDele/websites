<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Decision guide for whether you need a data warehouse yet: weigh sources, refresh cadence, consumers, governance and ownership, branching to not yet or build it.">
  <title>Do you need a data warehouse yet? A decision guide</title>
  <style>
    text{fill:#142321;font-family:"Instrument Sans","Instrument Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
    .eyebrow{font-size:22px;letter-spacing:3px;fill:#5a6964;font-weight:600;}
    .h{font-size:56px;font-weight:600;letter-spacing:-2.5px;fill:#142321;}
    .k{font-size:22px;letter-spacing:2px;fill:#5a6964;font-weight:600;}
    .crit{font-size:23px;fill:#142321;}
    .cardk{font-size:25px;letter-spacing:2px;font-weight:700;}
    .bul{font-size:22px;fill:#142321;}
    .concl{font-size:21px;fill:#142321;}
    .branch{font-size:20px;letter-spacing:1px;font-weight:600;}
    .foot{font-size:20px;letter-spacing:1px;fill:#5a6964;}
  </style>
  <defs>
    <marker id="ara" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#a9741f" stroke-width="1.8"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#3c6b43" stroke-width="1.8"/></marker>
  </defs>

  <rect width="1080" height="1080" fill="#f4f1e9"/>

  <text class="mono eyebrow" x="80" y="112">ARCHITECTURE · DECISION</text>
  <text class="h" x="80" y="176">Do you need a warehouse yet?</text>
  <line x1="80" y1="212" x2="1000" y2="212" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>

  <!-- test node -->
  <rect x="120" y="248" width="840" height="150" fill="#e7e4db" stroke="#142321" stroke-width="1.5"/>
  <text class="mono k" x="148" y="298">WEIGH SIX SIGNALS</text>
  <text class="mono crit" x="148" y="338" style="font-size:22px">sources · refresh cadence · consumers</text>
  <text class="mono crit" x="148" y="372" style="font-size:22px">governed definition · named owner · what breaks today</text>

  <!-- branch arrows -->
  <path d="M460,398 L280,470" fill="none" stroke="#a9741f" stroke-width="1.8" marker-end="url(#ara)"/>
  <path d="M620,398 L800,470" fill="none" stroke="#3c6b43" stroke-width="1.8" marker-end="url(#arg)"/>
  <text class="mono branch" x="290" y="424" text-anchor="middle" style="fill:#a9741f">mostly NO</text>
  <text class="mono branch" x="800" y="424" text-anchor="middle" style="fill:#3c6b43">mostly YES</text>

  <!-- NOT YET card -->
  <rect x="80" y="486" width="400" height="380" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.5"/>
  <text class="mono cardk" x="106" y="540" style="fill:#a9741f">NOT YET</text>
  <g class="mono bul">
    <rect x="106" y="580" width="8" height="8" fill="#a9741f"/><text x="128" y="588">1–2 systems</text>
    <rect x="106" y="622" width="8" height="8" fill="#a9741f"/><text x="128" y="630">weekly refresh is fine</text>
    <rect x="106" y="664" width="8" height="8" fill="#a9741f"/><text x="128" y="672">one team consumes it</text>
    <rect x="106" y="706" width="8" height="8" fill="#a9741f"/><text x="128" y="714">no owner after launch</text>
  </g>
  <line x1="106" y1="748" x2="454" y2="748" stroke="#a9741f" stroke-opacity="0.35" stroke-width="1"/>
  <text class="mono concl" x="106" y="790"><tspan style="fill:#a9741f">&#8594;</tspan> Shared definitions and</text>
  <text class="mono concl" x="106" y="820">a modelled view. Revisit</text>
  <text class="mono concl" x="106" y="850">in a quarter.</text>

  <!-- BUILD IT card with offset backing -->
  <rect x="612" y="498" width="400" height="380" fill="#142321"/>
  <rect x="600" y="486" width="400" height="380" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.5"/>
  <text class="mono cardk" x="626" y="540" style="fill:#3c6b43">BUILD IT</text>
  <g class="mono bul">
    <rect x="626" y="574" width="8" height="8" fill="#3c6b43"/><text x="648" y="582">several systems</text>
    <rect x="626" y="612" width="8" height="8" fill="#3c6b43"/><text x="648" y="620">daily decisions ride on it</text>
    <rect x="626" y="650" width="8" height="8" fill="#3c6b43"/><text x="648" y="658">many consumers</text>
    <rect x="626" y="688" width="8" height="8" fill="#3c6b43"/><text x="648" y="696">govern the definition once</text>
    <rect x="626" y="726" width="8" height="8" fill="#3c6b43"/><text x="648" y="734">someone owns it after</text>
  </g>
  <line x1="626" y1="762" x2="974" y2="762" stroke="#3c6b43" stroke-opacity="0.35" stroke-width="1"/>
  <text class="mono concl" x="626" y="804"><tspan style="fill:#3c6b43">&#8594;</tspan> Ingest &#8594; model &#8594; serve.</text>
  <text class="mono concl" x="626" y="834">A warehouse earns its place.</text>

  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>
  <text class="mono foot" x="80" y="1036">The Bredge · thebredge.com</text>
  <text class="mono foot" x="1000" y="1036" text-anchor="end" style="font-size:18px">insights/before-you-build-a-data-warehouse</text>
</svg>
