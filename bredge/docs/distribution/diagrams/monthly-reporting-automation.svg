<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="A manual monthly spreadsheet loop of export, clean, paste, format and email, repeated every month, replaced by an automated extract, transform, load pipeline on a schedule.">
  <title>Monthly reporting: from a manual spreadsheet loop to a scheduled pipeline</title>
  <style>
    text{fill:#142321;font-family:"Instrument Sans","Instrument Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
    .eyebrow{font-size:22px;letter-spacing:3px;fill:#5a6964;font-weight:600;}
    .h{font-size:56px;font-weight:600;letter-spacing:-2.5px;fill:#142321;}
    .sec{font-size:21px;letter-spacing:2px;font-weight:700;}
    .num{font-size:20px;letter-spacing:1px;font-weight:700;}
    .verb{font-size:26px;font-weight:600;letter-spacing:-0.5px;fill:#142321;}
    .stg{font-size:24px;font-weight:700;letter-spacing:1px;}
    .sub{font-size:19px;fill:#3f4f4a;}
    .loop{font-size:20px;letter-spacing:1px;font-weight:600;fill:#a9741f;}
    .band-k{font-size:24px;letter-spacing:3px;font-weight:700;fill:#90d26f;}
    .band-t{font-size:23px;letter-spacing:1px;fill:#f4f1e9;}
    .pill{font-size:22px;letter-spacing:1px;fill:#b6ef9d;}
    .foot{font-size:20px;letter-spacing:1px;fill:#5a6964;}
  </style>
  <defs>
    <marker id="ara" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#a9741f" stroke-width="1.8"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#3c6b43" stroke-width="1.8"/></marker>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#f4f1e9" stroke-width="2"/></marker>
  </defs>

  <rect width="1080" height="1080" fill="#f4f1e9"/>

  <text class="mono eyebrow" x="80" y="112">MONTHLY REPORTING · AUTOMATED</text>
  <text class="h" x="80" y="176">From spreadsheet to pipeline.</text>
  <line x1="80" y1="210" x2="1000" y2="210" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>

  <!-- MANUAL -->
  <text class="mono sec" x="80" y="252" style="fill:#a9741f">MANUAL — EVERY MONTH</text>
  <g>
    <!-- 5 step boxes: x 80,270,460,650,840 w160 -->
    <rect x="80" y="272" width="160" height="112" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <text class="mono num" x="98" y="312" style="fill:#a9741f">01</text><text class="verb" x="98" y="352">Export</text>
    <rect x="270" y="272" width="160" height="112" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <text class="mono num" x="288" y="312" style="fill:#a9741f">02</text><text class="verb" x="288" y="352">Clean</text>
    <rect x="460" y="272" width="160" height="112" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <text class="mono num" x="478" y="312" style="fill:#a9741f">03</text><text class="verb" x="478" y="352">Paste</text>
    <rect x="650" y="272" width="160" height="112" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <text class="mono num" x="668" y="312" style="fill:#a9741f">04</text><text class="verb" x="668" y="352">Format</text>
    <rect x="840" y="272" width="160" height="112" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <text class="mono num" x="858" y="312" style="fill:#a9741f">05</text><text class="verb" x="858" y="352">Email</text>
    <!-- arrows between -->
    <line x1="242" y1="328" x2="268" y2="328" stroke="#a9741f" stroke-width="1.6" marker-end="url(#ara)"/>
    <line x1="432" y1="328" x2="458" y2="328" stroke="#a9741f" stroke-width="1.6" marker-end="url(#ara)"/>
    <line x1="622" y1="328" x2="648" y2="328" stroke="#a9741f" stroke-width="1.6" marker-end="url(#ara)"/>
    <line x1="812" y1="328" x2="838" y2="328" stroke="#a9741f" stroke-width="1.6" marker-end="url(#ara)"/>
  </g>
  <!-- loop back -->
  <path d="M910,386 C 946,452 640,462 540,462 C 440,462 132,452 170,390" fill="none" stroke="#a9741f" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ara)"/>
  <rect x="232" y="438" width="616" height="30" fill="#f4f1e9"/>
  <text class="mono loop" x="540" y="460" text-anchor="middle">repeat every month · ≈ 2 days · copy-paste errors</text>

  <!-- AUTOMATE band -->
  <rect x="80" y="498" width="920" height="66" fill="#142321"/>
  <text class="mono band-k" x="106" y="539">AUTOMATE</text>
  <text class="mono band-t" x="330" y="539">extract · transform · load · schedule</text>

  <!-- AUTOMATED -->
  <text class="mono sec" x="80" y="606" style="fill:#3c6b43">AUTOMATED — ON A SCHEDULE</text>
  <g>
    <rect x="80" y="626" width="270" height="150" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.3"/>
    <text class="mono stg" x="104" y="678" style="fill:#3c6b43">SOURCES</text>
    <text class="mono sub" x="104" y="716">CRM · billing · ledger</text>

    <rect x="392" y="626" width="270" height="150" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.3"/>
    <text class="mono stg" x="416" y="678" style="fill:#3c6b43">TRANSFORM</text>
    <text class="mono sub" x="416" y="716">clean · join · rules</text>

    <rect x="716" y="638" width="284" height="150" fill="#142321"/>
    <rect x="704" y="626" width="284" height="150" fill="#b6ef9d" stroke="#3c6b43" stroke-width="1.3"/>
    <text class="mono stg" x="728" y="678" style="fill:#142321">PUBLISHED</text>
    <text class="mono sub" x="728" y="716" style="fill:#3c6b43">board report, on time</text>

    <line x1="358" y1="701" x2="388" y2="701" stroke="#3c6b43" stroke-width="1.8" marker-end="url(#arg)"/>
    <line x1="670" y1="701" x2="700" y2="701" stroke="#3c6b43" stroke-width="1.8" marker-end="url(#arg)"/>
  </g>

  <!-- schedule pill -->
  <rect x="220" y="820" width="640" height="72" fill="#142321"/>
  <text class="mono pill" x="540" y="864" text-anchor="middle">runs 06:00 · 1st of month · 0 manual steps</text>

  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>
  <text class="mono foot" x="80" y="1036">The Bredge · thebredge.com</text>
  <text class="mono foot" x="1000" y="1036" text-anchor="end" style="font-size:18px">insights/automate-monthly-reporting</text>
</svg>
