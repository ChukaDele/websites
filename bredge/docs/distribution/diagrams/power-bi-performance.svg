<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Why a Power BI dashboard is slow: four symptoms mapped to their likely cause and the first move to fix each, covering DAX, cardinality, star schema and incremental refresh.">
  <title>Power BI performance: symptom, likely cause, first move</title>
  <style>
    text{fill:#142321;font-family:"Instrument Sans","Instrument Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
    .eyebrow{font-size:22px;letter-spacing:3px;fill:#5a6964;font-weight:600;}
    .h{font-size:56px;font-weight:600;letter-spacing:-2.5px;fill:#142321;}
    .colk{font-size:21px;letter-spacing:2px;font-weight:700;}
    .cell{font-size:24px;font-weight:600;letter-spacing:-0.3px;fill:#142321;}
    .fixt{font-size:23px;fill:#142321;}
    .tag{font-size:17px;letter-spacing:1.5px;font-weight:700;fill:#3c6b43;}
    .arw{font-size:30px;fill:#5a6964;}
    .foot{font-size:20px;letter-spacing:1px;fill:#5a6964;}
  </style>

  <rect width="1080" height="1080" fill="#f4f1e9"/>

  <text class="mono eyebrow" x="80" y="112">POWER BI · PERFORMANCE</text>
  <text class="h" x="80" y="176">Why the dashboard is slow.</text>
  <line x1="80" y1="210" x2="1000" y2="210" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>

  <!-- column header band -->
  <rect x="80" y="240" width="920" height="52" fill="#142321"/>
  <text class="mono colk" x="102" y="274" style="fill:#f0bf6c">SYMPTOM</text>
  <text class="mono colk" x="414" y="274" style="fill:#f4f1e9">LIKELY CAUSE</text>
  <text class="mono colk" x="726" y="274" style="fill:#90d26f">FIRST MOVE</text>

  <!-- rows: y = 304,462,620,778 ; h=148 -->
  <g>
    <!-- row 1 -->
    <rect x="80" y="304" width="296" height="148" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.2"/>
    <rect x="392" y="304" width="296" height="148" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="704" y="304" width="296" height="148" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.2"/>
    <text class="arw mono" x="384" y="388" text-anchor="middle">&#8594;</text>
    <text class="arw mono" x="696" y="388" text-anchor="middle">&#8594;</text>
    <text class="cell" x="102" y="384">Slow on every</text><text class="cell" x="102" y="414">click</text>
    <text class="cell" x="414" y="384">DAX-heavy</text><text class="cell" x="414" y="414">model</text>
    <text class="fixt" x="726" y="380">Time it in</text><text class="fixt" x="726" y="408">Performance Analyzer</text>
    <text class="mono tag" x="726" y="440">DAX</text>

    <!-- row 2 -->
    <rect x="80" y="462" width="296" height="148" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.2"/>
    <rect x="392" y="462" width="296" height="148" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="704" y="462" width="296" height="148" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.2"/>
    <text class="arw mono" x="384" y="546" text-anchor="middle">&#8594;</text>
    <text class="arw mono" x="696" y="546" text-anchor="middle">&#8594;</text>
    <text class="cell" x="102" y="542">Huge .pbix</text><text class="cell" x="102" y="572">file</text>
    <text class="cell" x="414" y="542">One wide</text><text class="cell" x="414" y="572">high-card. column</text>
    <text class="fixt" x="726" y="538">Drop or split</text><text class="fixt" x="726" y="566">the column</text>
    <text class="mono tag" x="726" y="598">CARDINALITY</text>

    <!-- row 3 -->
    <rect x="80" y="620" width="296" height="148" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.2"/>
    <rect x="392" y="620" width="296" height="148" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="704" y="620" width="296" height="148" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.2"/>
    <text class="arw mono" x="384" y="704" text-anchor="middle">&#8594;</text>
    <text class="arw mono" x="696" y="704" text-anchor="middle">&#8594;</text>
    <text class="cell" x="102" y="700">One flat</text><text class="cell" x="102" y="730">table</text>
    <text class="cell" x="414" y="700">No star</text><text class="cell" x="414" y="730">schema</text>
    <text class="fixt" x="726" y="696">Split into facts</text><text class="fixt" x="726" y="724">+ dimensions</text>
    <text class="mono tag" x="726" y="756">STAR SCHEMA</text>

    <!-- row 4 -->
    <rect x="80" y="778" width="296" height="148" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.2"/>
    <rect x="392" y="778" width="296" height="148" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="704" y="778" width="296" height="148" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.2"/>
    <text class="arw mono" x="384" y="862" text-anchor="middle">&#8594;</text>
    <text class="arw mono" x="696" y="862" text-anchor="middle">&#8594;</text>
    <text class="cell" x="102" y="858">Refresh crawls</text><text class="cell" x="102" y="888">or fails</text>
    <text class="cell" x="414" y="858">Full reload</text><text class="cell" x="414" y="888">every time</text>
    <text class="fixt" x="726" y="854">Load only new</text><text class="fixt" x="726" y="882">rows on refresh</text>
    <text class="mono tag" x="726" y="914">INCREMENTAL</text>
  </g>

  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>
  <text class="mono foot" x="80" y="1036">The Bredge · thebredge.com</text>
  <text class="mono foot" x="1000" y="1036" text-anchor="end" style="font-size:18px">insights/power-bi-slow</text>
</svg>
