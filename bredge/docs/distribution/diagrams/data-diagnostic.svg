<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="A data diagnostic maps the current environment and its findings, scores each by impact times effort, and returns a prioritised roadmap of what to fix first.">
  <title>Data diagnostic: map the environment, then fix in priority order</title>
  <style>
    text{fill:#142321;font-family:"Instrument Sans","Instrument Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
    .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
    .eyebrow{font-size:22px;letter-spacing:3px;fill:#5a6964;font-weight:600;}
    .h{font-size:56px;font-weight:600;letter-spacing:-2.5px;fill:#142321;}
    .sec{font-size:21px;letter-spacing:2px;font-weight:700;fill:#5a6964;}
    .clbl{font-size:19px;letter-spacing:1px;fill:#5a6964;font-weight:600;}
    .find{font-size:23px;font-weight:600;letter-spacing:-0.3px;fill:#142321;}
    .band-k{font-size:24px;letter-spacing:3px;font-weight:700;fill:#90d26f;}
    .band-t{font-size:23px;letter-spacing:1px;fill:#f4f1e9;}
    .rank{font-size:30px;letter-spacing:-1px;font-weight:700;}
    .tag{font-size:16px;letter-spacing:2px;font-weight:700;}
    .fix{font-size:26px;font-weight:600;letter-spacing:-0.4px;fill:#142321;}
    .mlbl{font-size:14px;letter-spacing:1.5px;font-weight:700;fill:#5a6964;}
    .foot{font-size:20px;letter-spacing:1px;fill:#5a6964;}
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#142321" stroke-width="1.6"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L7,5 L0,10" fill="none" stroke="#3c6b43" stroke-width="1.8"/></marker>
  </defs>

  <rect width="1080" height="1080" fill="#f4f1e9"/>

  <text class="mono eyebrow" x="80" y="112">DATA DIAGNOSTIC · WHAT TO FIX FIRST</text>
  <text class="h" x="80" y="176">Map it, then fix in order.</text>
  <line x1="80" y1="210" x2="1000" y2="210" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>

  <!-- CURRENT STATE -->
  <text class="mono sec" x="80" y="248">CURRENT STATE · FINDINGS</text>
  <g>
    <rect x="80" y="266" width="215" height="150" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <circle cx="104" cy="296" r="5" fill="#f0bf6c"/><text class="mono clbl" x="122" y="302">BILLING</text>
    <text class="find" x="100" y="352">duplicate</text><text class="find" x="100" y="382">invoices</text>

    <rect x="315" y="266" width="215" height="150" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <circle cx="339" cy="296" r="5" fill="#f0bf6c"/><text class="mono clbl" x="357" y="302">PRODUCT</text>
    <text class="find" x="335" y="352">no identity</text><text class="find" x="335" y="382">key</text>

    <rect x="550" y="266" width="215" height="150" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <circle cx="574" cy="296" r="5" fill="#f0bf6c"/><text class="mono clbl" x="592" y="302">FINANCE</text>
    <text class="find" x="570" y="352">manual</text><text class="find" x="570" y="382">month-end</text>

    <rect x="785" y="266" width="215" height="150" fill="#f8ecd2" stroke="#a9741f" stroke-width="1.3"/>
    <circle cx="809" cy="296" r="5" fill="#f0bf6c"/><text class="mono clbl" x="827" y="302">REPORTS</text>
    <text class="find" x="805" y="352">3 revenue</text><text class="find" x="805" y="382">figures</text>
  </g>

  <line x1="540" y1="416" x2="540" y2="452" stroke="#142321" stroke-opacity="0.55" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- SCORE band -->
  <rect x="80" y="456" width="920" height="66" fill="#142321"/>
  <text class="mono band-k" x="106" y="497">SCORE</text>
  <text class="mono band-t" x="290" y="497">rank every finding by impact × effort</text>

  <!-- ROADMAP -->
  <text class="mono sec" x="80" y="560">PRIORITISED ROADMAP</text>

  <!-- row 1 : DO FIRST -->
  <rect x="86" y="590" width="914" height="86" fill="#142321"/>
  <rect x="80" y="584" width="914" height="86" fill="#e3f2d7" stroke="#3c6b43" stroke-width="1.5"/>
  <text class="mono rank" x="106" y="640" style="fill:#3c6b43">01</text>
  <text class="mono tag" x="176" y="616" style="fill:#3c6b43">DO FIRST</text>
  <text class="fix" x="176" y="652">Agree one revenue definition</text>
  <text class="mono mlbl" x="700" y="614">IMPACT</text>
  <rect x="700" y="626" width="16" height="16" fill="#3c6b43"/><rect x="722" y="626" width="16" height="16" fill="#3c6b43"/><rect x="744" y="626" width="16" height="16" fill="#3c6b43"/>
  <text class="mono mlbl" x="850" y="614">EFFORT</text>
  <rect x="850" y="626" width="16" height="16" fill="#a9741f"/><rect x="872" y="626" width="16" height="16" fill="none" stroke="#a9741f" stroke-opacity="0.5" stroke-width="1.5"/><rect x="894" y="626" width="16" height="16" fill="none" stroke="#a9741f" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- row 2 -->
  <rect x="80" y="680" width="914" height="86" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
  <text class="mono rank" x="106" y="736" style="fill:#5a6964">02</text>
  <text class="mono tag" x="176" y="712" style="fill:#5a6964">NEXT</text>
  <text class="fix" x="176" y="748">Reconcile billing ↔ ledger</text>
  <text class="mono mlbl" x="700" y="710">IMPACT</text>
  <rect x="700" y="722" width="16" height="16" fill="#3c6b43"/><rect x="722" y="722" width="16" height="16" fill="#3c6b43"/><rect x="744" y="722" width="16" height="16" fill="#3c6b43"/>
  <text class="mono mlbl" x="850" y="710">EFFORT</text>
  <rect x="850" y="722" width="16" height="16" fill="#a9741f"/><rect x="872" y="722" width="16" height="16" fill="#a9741f"/><rect x="894" y="722" width="16" height="16" fill="none" stroke="#a9741f" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- row 3 -->
  <rect x="80" y="776" width="914" height="86" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
  <text class="mono rank" x="106" y="832" style="fill:#5a6964">03</text>
  <text class="mono tag" x="176" y="808" style="fill:#5a6964">THEN</text>
  <text class="fix" x="176" y="844">Automate the monthly report</text>
  <text class="mono mlbl" x="700" y="806">IMPACT</text>
  <rect x="700" y="818" width="16" height="16" fill="#3c6b43"/><rect x="722" y="818" width="16" height="16" fill="#3c6b43"/><rect x="744" y="818" width="16" height="16" fill="none" stroke="#3c6b43" stroke-opacity="0.5" stroke-width="1.5"/>
  <text class="mono mlbl" x="850" y="806">EFFORT</text>
  <rect x="850" y="818" width="16" height="16" fill="#a9741f"/><rect x="872" y="818" width="16" height="16" fill="#a9741f"/><rect x="894" y="818" width="16" height="16" fill="none" stroke="#a9741f" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- row 4 -->
  <rect x="80" y="872" width="914" height="86" fill="#efece3" stroke="#142321" stroke-opacity="0.4" stroke-width="1.2"/>
  <text class="mono rank" x="106" y="928" style="fill:#5a6964">04</text>
  <text class="mono tag" x="176" y="904" style="fill:#5a6964">LATER</text>
  <text class="fix" x="176" y="940">Backfill product identity keys</text>
  <text class="mono mlbl" x="700" y="902">IMPACT</text>
  <rect x="700" y="914" width="16" height="16" fill="#3c6b43"/><rect x="722" y="914" width="16" height="16" fill="#3c6b43"/><rect x="744" y="914" width="16" height="16" fill="none" stroke="#3c6b43" stroke-opacity="0.5" stroke-width="1.5"/>
  <text class="mono mlbl" x="850" y="902">EFFORT</text>
  <rect x="850" y="914" width="16" height="16" fill="#a9741f"/><rect x="872" y="914" width="16" height="16" fill="#a9741f"/><rect x="894" y="914" width="16" height="16" fill="#a9741f"/>

  <line x1="80" y1="1000" x2="1000" y2="1000" stroke="#142321" stroke-opacity="0.16" stroke-width="1"/>
  <text class="mono foot" x="80" y="1036">The Bredge · thebredge.com</text>
  <text class="mono foot" x="1000" y="1036" text-anchor="end" style="font-size:18px">insights/what-to-fix-first</text>
</svg>
